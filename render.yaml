services:
  - type: web
    name: rckt-agent-starter
    runtime: python
    buildCommand: "pip install -r requirements.txt && cd frontend && npm install && npm run build && cd .."
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.18.0
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AGENT_MODEL
        value: openrouter/auto
      - key: AGENT_FALLBACK_MODEL
        value: openrouter/free
      - key: AGENT_USE_FALLBACK
        value: "true"
      - key: AGENT_MAX_TOKENS
        value: "700"
      - key: MAX_FILE_SIZE_MB
        value: "10"
      - key: DOCUMENT_MAX_CHARS
        value: "50000"
